name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
    #  Checkout repository
    - name: Checkout code
      uses: actions/checkout@v4

    # Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    # Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Verify pytest installation
      run: |
        python -m pip show pytest
        python -m pytest --version

    # Run unit tests
    - name: Run tests
      run: |
        python -m pytest tests

    # Login to Docker Hub
    - name: Docker login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/lib/android

    # Build Docker image
    - name: Build Docker image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cats-dogs-mlops:latest .

    - name: Smoke test (run container and hit /health)
      run: |
        docker run -d --name catsdogs_smoke -p 8000:8000 ${{ secrets.DOCKERHUB_USERNAME }}/cats-dogs-mlops:latest

    # wait until service is up (retry up to ~60s)
     for i in {1..30}; do
      if curl -fsS http://localhost:8000/health > /dev/null; then
        echo "Smoke test passed"
        exit 0
      fi
      echo "waiting... ($i)"
      sleep 2
     done

     echo "Smoke test failed - printing logs"
     docker logs catsdogs_smoke --tail 200
     exit 1

    - name: Cleanup container
      if: always()
      run: |
        docker rm -f catsdogs_smoke || true

    # Push Docker hookup
    - name: Push Docker image
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/cats-dogs-mlops:latest
